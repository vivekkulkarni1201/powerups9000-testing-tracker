<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan POWERUPS QR</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="pilot.css"><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script></head><body><div class="main"><div class="scannerBox"><div class="top"><div><h1>📷 Scan POWERUPS QR</h1><div class="sub">Works as mobile scanner; normal phone Camera QR scan also remains supported.</div></div><a class="btn" href="pilot-home.html">Home</a></div><div class="card"><div id="reader"></div><div id="scanMsg" class="small" style="margin-top:10px"></div></div></div></div><script>function go(text){try{let id='';if(/^P9K-Q\d{4,6}$/i.test(text.trim()))id=text.trim().toUpperCase();else{let u=new URL(text);id=(u.searchParams.get('id')||'').toUpperCase()}if(!/^P9K-Q\d{4,6}$/.test(id)){scanMsg.textContent='❌ Not a valid POWERUPS 9000 Tracker QR';scanMsg.className='error';return}location.href='pilot-scan.html?id='+encodeURIComponent(id)}catch(e){scanMsg.textContent='❌ QR not recognized';scanMsg.className='error'}}const q=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:250,height:250}},false);q.render((txt)=>{q.clear().finally(()=>go(txt))},()=>{});</script></body></html>
