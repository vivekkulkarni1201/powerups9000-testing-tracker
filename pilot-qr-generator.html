<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Generator</title><link rel="stylesheet" href="pilot.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div class="app"><aside class="side" id="sidebar"></aside><main class="main"><div class="top"><div><h1>POWERUPS 9000 QR Generator</h1><div class="sub">Preview / test QR set. Factory bulk printing can continue through BarTender serialization.</div></div><a class="btn" href="pilot-dashboard.html">Dashboard</a></div><div class="card noPrint"><div class="formGrid"><div class="field"><label>Starting Tracker Number</label><input id="startNo" type="number" min="1" value="1"></div><div class="field"><label>Quantity</label><select id="qty"><option>1</option><option selected>5</option><option>10</option><option>25</option><option>50</option><option>100</option></select></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="generate()">Generate QR Set</button><button class="btn" onclick="window.print()">Print Preview</button></div></div><div class="card"><div id="qrGrid" class="qrPrintGrid"></div></div></main></div><script src="pilot-common.js"></script><script>sidebar.innerHTML=nav('qr');function rootUrl(){let p=location.pathname;return location.origin+p.substring(0,p.lastIndexOf('/')+1)}function generate(){let st=+startNo.value||1,n=+qty.value||1;qrGrid.innerHTML='';for(let i=0;i<n;i++){let id='P9K-Q'+String(st+i).padStart(4,'0'),url=rootUrl()+'pilot-scan.html?id='+encodeURIComponent(id),c=document.createElement('div');c.className='qrPrintCard';let q=document.createElement('div');q.style='display:flex;justify-content:center';let title=document.createElement('div');title.innerHTML=`<b style="font-size:16px">POWERUPS 9000</b><br><b>${id}</b><br><span style="font-size:10px">TEST TRACKER</span>`;title.style.marginTop='8px';c.append(q,title);qrGrid.appendChild(c);new QRCode(q,{text:url,width:175,height:175,correctLevel:QRCode.CorrectLevel.M})}}generate();</script></body></html>
