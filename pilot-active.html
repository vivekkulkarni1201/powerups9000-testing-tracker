<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active UPS</title><link rel="stylesheet" href="pilot.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="app"><aside class="side" id="sidebar"></aside><main class="main"><div class="top"><div><h1>Active UPS / Live Trackers</h1><div class="sub">Laptop engineer view · open any live UPS without scanning its QR</div></div><div class="actions"><a class="btn green" href="pilot-scanner.html">📷 Scan QR</a><a class="btn primary" href="pilot-dashboard.html">Dashboard</a></div></div>
<div class="card"><div class="filterBar"><input id="q" placeholder="Search serial / Tracker ID" oninput="render()"><select id="fProject" onchange="render()"><option value="">All Projects</option></select><select id="fStage" onchange="render()"><option value="">All Stages</option></select><select id="fEngineer" onchange="render()"><option value="">All Engineers</option></select><select id="fSource" onchange="render()"><option value="">All Sources</option><option value="MANUAL">Manual / Till-Date</option><option value="QR">QR</option></select></div></div>
<div id="cards" class="activeGrid" style="margin-top:12px"></div></main></div><script src="pilot-common.js"></script><script>
sidebar.innerHTML=nav('active');let rows=[];
async function load(){let {data,error}=await sb.from('p9k_prod_trackers').select('*').is('completed_at',null).neq('current_stage','TO_FINISHING').order('last_updated_at',{ascending:false});if(error)return showToast(error.message,false);rows=data||[];fillFilters();render()}
function fillFilters(){let p=[...new Set(rows.map(x=>x.project_code).filter(Boolean))],s=[...new Set(rows.map(x=>x.current_stage).filter(Boolean))],e=[...new Set(rows.map(x=>x.last_engineer).filter(Boolean))];fProject.innerHTML='<option value="">All Projects</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('');fStage.innerHTML='<option value="">All Stages</option>'+s.map(x=>`<option value="${x}">${esc(STAGE_LABEL[x]||x)}</option>`).join('');fEngineer.innerHTML='<option value="">All Engineers</option>'+e.map(x=>`<option>${esc(x)}</option>`).join('')}
function render(){let z=q.value.toLowerCase(),a=rows.filter(x=>(!z||String(x.serial_no||'').toLowerCase().includes(z)||x.tracker_id.toLowerCase().includes(z))&&(!fProject.value||x.project_code===fProject.value)&&(!fStage.value||x.current_stage===fStage.value)&&(!fEngineer.value||x.last_engineer===fEngineer.value)&&(!fSource.value||(fSource.value==='MANUAL'?x.source?.startsWith('MANUAL'):!x.source?.startsWith('MANUAL'))));cards.innerHTML=a.length?a.map(x=>`<div class="activeCard"><div class="titleRow"><div><h3>${esc(x.serial_no||'Serial Not Assigned')}</h3><div class="small">${esc(x.tracker_id)}</div></div>${stagePill(x.current_stage)}</div><div class="activeMeta"><div><span>Project</span><b>${esc(x.project_code||'—')}</b></div><div><span>Engineer</span><b>${esc(x.last_engineer||'—')}</b></div><div><span>Last Updated</span><b>${dstr(x.last_updated_at)}</b></div><div><span>Source</span><b>${esc(x.source||'QR')}</b></div></div><div class="actions" style="margin-top:12px"><a class="btn green" href="pilot-scan.html?id=${encodeURIComponent(x.tracker_id)}">Open / Update UPS</a><button class="btn" onclick="showQR('${esc(x.tracker_id)}')">Show QR</button>${x.source?.startsWith('MANUAL')?`<button class="btn purple" onclick="linkQR('${esc(x.tracker_id)}')">Link Physical QR</button>`:''}</div><div id="qr-${x.tracker_id.replaceAll(/[^A-Za-z0-9]/g,'')}" style="margin-top:10px"></div></div>`).join(''):'<div class="card emptyState">No active UPS match the selected filters.</div>'}
function showQR(id){let box=document.getElementById('qr-'+id.replaceAll(/[^A-Za-z0-9]/g,''));let url=location.origin+location.pathname.replace('pilot-active.html','pilot-scan.html')+'?id='+encodeURIComponent(id);box.innerHTML=`<div class="softNote">${esc(url)}</div>`;navigator.clipboard?.writeText(url);showToast('Update link copied. Physical QR view is available from QR Generator.')}
async function linkQR(oldId){let n=prompt('Enter the physical QR Tracker ID to link (example P9K-Q0045):');if(!n)return;let {data,error}=await sb.rpc('p9k_prod_link_manual_tracker',{p_old_tracker_id:oldId,p_new_tracker_id:n});if(error)return alert(error.message);showToast('Manual UPS linked to '+data.tracker_id);load()}
load();subscribeTrackers(load);setInterval(load,30000);
</script></body></html>
