<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active UPS</title><link rel="stylesheet" href="pilot.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="app"><aside class="side" id="sidebar"></aside><main class="main"><div class="top"><div><h1>Active UPS on Shop Floor / Live Trackers</h1><div class="sub">Laptop engineer view · Faulty/RTA units stay visible in red until returned to testing</div></div><div class="actions"><a class="btn green" href="pilot-scanner.html">📷 Scan QR</a><a class="btn primary" href="pilot-dashboard.html">Dashboard</a></div></div><div class="card"><div class="filterBar"><input id="q" placeholder="Search serial / Tracker ID" oninput="render()"><select id="fProject" onchange="render()"><option value="">All Projects</option></select><select id="fStage" onchange="render()"><option value="">All Stages</option></select><select id="fEngineer" onchange="render()"><option value="">All Engineers</option></select><select id="fBay" onchange="render()"><option value="">All Test Bays</option></select><select id="fFault" onchange="render()"><option value="">All Status</option><option value="FAULTY">Faulty / RTA</option><option value="NORMAL">Normal Active</option></select></div></div><div id="cards" class="activeGrid" style="margin-top:12px"></div></main></div><script src="pilot-common.js"></script><script>
sidebar.innerHTML=nav('active');let rows=[];async function load(){let {data,error}=await sb.from('p9k_prod_trackers').select('*').is('completed_at',null).neq('current_stage','TO_FINISHING').order('last_updated_at',{ascending:false});if(error)return showToast(error.message,false);rows=data||[];fillFilters();render()}function fillFilters(){let p=[...new Set(rows.map(x=>x.project_code).filter(Boolean))],s=[...new Set(rows.map(x=>x.current_stage).filter(Boolean))],e=[...new Set(rows.map(x=>x.last_engineer).filter(Boolean))],b=[...new Set(rows.map(x=>x.test_bay).filter(Boolean))];fProject.innerHTML='<option value="">All Projects</option>'+p.map(x=>`<option>${esc(x)}</option>`).join('');fStage.innerHTML='<option value="">All Stages</option>'+s.map(x=>`<option value="${x}">${esc(STAGE_LABEL[x]||x)}</option>`).join('');fEngineer.innerHTML='<option value="">All Engineers</option>'+e.map(x=>`<option>${esc(x)}</option>`).join('');fBay.innerHTML='<option value="">All Test Bays</option>'+b.map(x=>`<option>${esc(x)}</option>`).join('')}function render(){let z=q.value.toLowerCase(),a=rows.filter(x=>(!z||String(x.serial_no||'').toLowerCase().includes(z)||x.tracker_id.toLowerCase().includes(z))&&(!fProject.value||x.project_code===fProject.value)&&(!fStage.value||x.current_stage===fStage.value)&&(!fEngineer.value||x.last_engineer===fEngineer.value)&&(!fBay.value||x.test_bay===fBay.value)&&(!fFault.value||(fFault.value==='FAULTY'?x.is_faulty:!x.is_faulty)));cards.innerHTML=a.length?a.map(x=>`<div class="activeCard ${x.is_faulty?'faultyCard':''}"><div class="titleRow"><div><h3>${esc(x.serial_no||'Serial Not Assigned')}</h3><div class="small">${trackerBadge(x)}</div></div>${x.is_faulty?'<span class="pill red">FAULTY / RTA</span>':stagePill(x.current_stage)}</div>${x.is_faulty?`<div class="faultBanner"><b>⚠ FAULTY / RTA</b><div class="small">${esc(x.faulty_reason||'Fault')} · since ${dstr(x.faulty_since)}</div></div>`:''}<div class="activeMeta"><div><span>Project</span><b>${esc(x.project_code||'—')}</b></div><div><span>Rating</span><b>${x.rating_kva?x.rating_kva+' kVA':'—'}</b></div><div><span>Engineer</span><b>${esc(x.last_engineer||'—')}</b></div><div><span>Test Bay</span><b>${esc(x.test_bay||'—')}</b></div><div><span>Last Updated</span><b>${dstr(x.last_updated_at)}</b></div><div><span>Source</span><b>${esc(x.source||'QR')}</b></div></div><div class="actions" style="margin-top:12px"><a class="btn green" href="pilot-scan.html?id=${encodeURIComponent(x.tracker_id)}">Open / Update UPS</a><a class="btn" href="pilot-project.html?project=${encodeURIComponent(x.project_code||'')}">Project</a>${x.source?.startsWith('MANUAL')?`<button class="btn purple" onclick="linkQR('${esc(x.tracker_id)}')">Link Physical QR</button>`:''}</div></div>`).join(''):'<div class="card emptyState">No active UPS match selected filters.</div>'}async function linkQR(oldId){let n=prompt('Enter physical QR Tracker ID (example P9K-Q0045):');if(!n)return;let {data,error}=await sb.rpc('p9k_prod_link_manual_tracker_v5',{p_old_tracker_id:oldId,p_new_tracker_id:n});if(error)return alert(error.message);showToast('Manual UPS linked to '+data.tracker_id);load()}load();subscribeTrackers(load);setInterval(load,30000);
</script></body></html>
