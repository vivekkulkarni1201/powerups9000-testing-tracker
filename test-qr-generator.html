<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P9K Test QR</title><link rel="stylesheet" href="test-style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div class="wrap"><div class="top"><div><h2>Test QR Generator</h2><div class="sub">Browser test only; BarTender can use the same URL pattern.</div></div><a class="btn" href="test-dashboard.html">Dashboard</a></div><div class="panel"><div class="controls"><div class="field"><label>Start</label><input id="start" type="number" value="1"></div><div class="field"><label>Qty</label><select id="qty"><option>1</option><option selected>5</option><option>10</option></select></div><button class="btn primary" onclick="gen()">Generate</button></div><div id="pattern" class="box"></div></div><div id="grid" class="qrgrid"></div></div><script>function root(){const p=location.pathname;return location.origin+p.substring(0,p.lastIndexOf('/')+1)}function gen(){const s=+start.value,n=+qty.value,r=root();grid.innerHTML='';pattern.innerHTML='<b>BarTender starting URL</b><br>'+r+'test-scan.html?id=P9K-Q'+String(s).padStart(4,'0')+'<br><span class="small">Serialize only the numeric suffix.</span>';for(let i=0;i<n;i++){const id='P9K-Q'+String(s+i).padStart(4,'0'),u=r+'test-scan.html?id='+encodeURIComponent(id),c=document.createElement('div'),b=document.createElement('div'),t=document.createElement('b');c.className='qrcard';t.textContent=id;c.append(b,t);grid.appendChild(c);new QRCode(b,{text:u,width:170,height:170,correctLevel:QRCode.CorrectLevel.M})}}gen()</script></body></html>
