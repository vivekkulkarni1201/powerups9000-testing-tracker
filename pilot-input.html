<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Testing Load Distribution</title><link rel="stylesheet" href="pilot.css"><link rel="stylesheet" href="premium.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="app"><aside class="side" id="sidebar"></aside><main class="main"><div class="detailHead"><div><h1>Daily Testing Load Distribution</h1><div class="sub">Day-wise planned capacity vs actual UPS receipts and shortfall reasons</div></div><div class="actions"><select id="monthSel" class="monthSel" onchange="load()"></select><button class="btn green" onclick="copyTable()">Copy Styled Table for Email</button><a class="btn primary" href="pilot-dashboard.html">← Dashboard</a></div></div><div class="summary4"><div class="metric"><span>Monthly Ideal Capacity</span><b id="sIdeal">0</b></div><div class="metric"><span>Received for Testing</span><b id="sReceived">0</b></div><div class="metric"><span>Net GAP</span><b id="sGap">0</b></div><div class="metric"><span>Days Met Target</span><b id="sDays">0</b></div></div><div class="card"><div class="titleRow"><h2 id="tableTitle">Daily Testing Status</h2><span id="copyMsg" class="small"></span></div><div class="tableWrap"><table id="bossTable" class="bossTable"></table></div><div class="remarkLegend" id="remarkLegend"><b>Note:</b></div></div></main></div><script src="pilot-common.js"></script><script>
sidebar.innerHTML=nav('input');let current={},remarkCats=[];function setup(){let n=new Date(),o='';for(let i=0;i<12;i++){let d=new Date(n.getFullYear(),n.getMonth()-i,1);o+=`<option value="${d.getFullYear()}-${d.getMonth()+1}">${d.toLocaleString([],{month:'long',year:'numeric'})}</option>`}monthSel.innerHTML=o}
async function load(){let [yy,mm]=monthSel.value.split('-').map(Number),days=new Date(yy,mm,0).getDate(),b=new Date(yy,mm-1,1),e=new Date(yy,mm,1);let [{data:t},{data:s},{data:dp},{data:rc}]=await Promise.all([sb.from('p9k_prod_trackers').select('received_at').gte('received_at',b.toISOString()).lt('received_at',e.toISOString()),sb.from('p9k_prod_settings').select('*').eq('id',1).single(),sb.from('p9k_prod_daily_plan').select('*').gte('work_date',`${yy}-${String(mm).padStart(2,'0')}-01`).lt('work_date',`${e.getFullYear()}-${String(e.getMonth()+1).padStart(2,'0')}-01`),sb.from('p9k_prod_remark_categories').select('*').eq('active',true).order('sort_order')]);remarkCats=rc||[];remarkLegend.innerHTML='<b>Note:</b><br>'+remarkCats.map(x=>`<b>${esc(x.code)}</b> - ${esc(x.meaning)}`).join('<br>');let rows=[],idealTot=0,recTot=0,met=0;for(let d=1;d<=days;d++){let date=new Date(yy,mm-1,d),iso=`${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`,ov=(dp||[]).find(x=>x.work_date===iso),ideal=ov?.ideal_capacity??(date.getDay()===0?0:(s?.ideal_daily_capacity||0)),live=(t||[]).filter(x=>{let z=new Date(x.received_at);return z.getFullYear()===yy&&z.getMonth()===mm-1&&z.getDate()===d}).length,rec=(ov&&ov.manual_received_qty>0)?ov.manual_received_qty:live,gap=ideal?rec-ideal:0,remarks=(ov?.remark_codes&&ov.remark_codes.length)?ov.remark_codes:((ov?.remark_code)?String(ov.remark_code).split(',').filter(Boolean):(ideal>0&&rec<ideal?['A']:[]));if(ideal>0){idealTot+=ideal;recTot+=rec;if(rec>=ideal)met++}rows.push({d,iso,ideal,rec,gap,remarks,holiday:ideal===0,planIdeal:ov?.ideal_capacity??null,manualQty:ov?.manual_received_qty||0,remarkText:ov?.remark_text||null})}current={yy,mm,rows};sIdeal.textContent=idealTot;sReceived.textContent=recTot;sGap.textContent=recTot-idealTot;sDays.textContent=met;tableTitle.textContent=`POWERUPS 9000 Daily Testing Status — ${new Date(yy,mm-1,1).toLocaleString([],{month:'long',year:'numeric'})}`;render()}
function render(){let mon=new Date(current.yy,current.mm-1,1).toLocaleString([],{month:'short'}),h='<tr><th>Date</th>'+current.rows.map(r=>`<th class="${r.holiday?'holiday':''}">${String(r.d).padStart(2,'0')}-${mon}</th>`).join('')+'</tr>';h+='<tr><td>Ideal Capacity</td>'+current.rows.map(r=>`<td class="${r.holiday?'holiday':''}">${r.holiday?'':r.ideal}</td>`).join('')+'</tr>';h+='<tr><td>Received for testing</td>'+current.rows.map(r=>`<td class="${r.holiday?'holiday':''}">${r.holiday?'':r.rec}</td>`).join('')+'</tr>';h+='<tr class="gaprow"><td>GAP</td>'+current.rows.map(r=>`<td class="${r.holiday?'holiday':''}">${r.holiday?'':r.gap}</td>`).join('')+'</tr>';h+='<tr><td>Remarks</td>'+current.rows.map(r=>`<td class="${r.holiday?'holiday':''}">${r.holiday?'':`<div class="multiRemark">${remarkCats.map(c=>`<label><input type="checkbox" ${r.remarks.includes(c.code)?'checked':''} onchange="saveRemark('${r.iso}')" data-code="${esc(c.code)}">${esc(c.code)}</label>`).join('')}</div>`}</td>`).join('')+'</tr>';bossTable.innerHTML=h}

async function saveRemark(date){let r=current.rows.find(x=>x.iso===date);let cell=[...bossTable.querySelectorAll(`input[onchange="saveRemark('${date}')"]`)];let codes=cell.filter(x=>x.checked).map(x=>x.dataset.code);let {error}=await sb.rpc('p9k_prod_save_daily_plan_v5',{p_work_date:date,p_ideal_capacity:r?.planIdeal,p_manual_received_qty:r?.manualQty||0,p_remark_codes:codes,p_remark_text:r?.remarkText||null});if(error){copyMsg.textContent='❌ '+error.message;copyMsg.className='error';return}r.remarks=codes;copyMsg.textContent='✓ Remarks saved for '+date;copyMsg.className='success'}
function emailHTML(){const border='#7F8C8D',blue='#17365D',head='#D9EAF7',orange='#F4B183',yellow='#FFF2CC';const td=(v,bg='#fff',bold=false,left=false)=>`<td style="border:1px solid ${border};padding:6px 8px;background:${bg};font-family:Arial;font-size:10.5pt;text-align:${left?'left':'center'};${bold?'font-weight:bold;':''}">${esc(v)}</td>`;let mon=new Date(current.yy,current.mm-1,1).toLocaleString([],{month:'short'});return `<div style="font-family:Arial"><div style="font-size:16pt;font-weight:bold;color:${blue};margin-bottom:8px">POWERUPS 9000 Daily Testing Status — ${new Date(current.yy,current.mm-1,1).toLocaleString([],{month:'long',year:'numeric'})}</div><table cellspacing="0" cellpadding="0" style="border-collapse:collapse"><tr>${td('Date',head,true,true)}${current.rows.map(r=>td(String(r.d).padStart(2,'0')+'-'+mon,r.holiday?yellow:head,true)).join('')}</tr><tr>${td('Ideal Capacity','#fff',true,true)}${current.rows.map(r=>td(r.holiday?'':r.ideal,r.holiday?yellow:'#fff')).join('')}</tr><tr>${td('Received for testing','#fff',true,true)}${current.rows.map(r=>td(r.holiday?'':r.rec,r.holiday?yellow:'#fff')).join('')}</tr><tr>${td('GAP',orange,true,true)}${current.rows.map(r=>td(r.holiday?'':r.gap,r.holiday?yellow:orange,true)).join('')}</tr><tr>${td('Remark','#fff',true,true)}${current.rows.map(r=>td(r.holiday?'':r.remarks.join(', '),r.holiday?yellow:'#fff',true)).join('')}</tr></table><div style="margin-top:10px;font-size:10.5pt;line-height:1.5"><b>Note:</b><br>${remarkCats.map(x=>`<b>${esc(x.code)}</b> - ${esc(x.meaning)}`).join('<br>')}</div></div>`}
async function copyTable(){let html=emailHTML(),plain=bossTable.innerText+'\n\nNote:\n'+remarkCats.map(x=>x.code+' - '+x.meaning).join('\n');try{if(window.ClipboardItem)await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]);else await navigator.clipboard.writeText(plain);copyMsg.textContent='✓ Styled table copied — paste into Outlook.';copyMsg.className='success'}catch(e){copyMsg.textContent='Copy failed: '+e.message;copyMsg.className='error'}}
setup();load();
</script></body></html>
