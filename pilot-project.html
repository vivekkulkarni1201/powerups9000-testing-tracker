<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Project Detail</title><link rel="stylesheet" href="pilot.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>
html,body{max-width:100%;overflow-x:hidden}
.main{min-width:0}
#hero .projectHero{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,720px);gap:18px;align-items:stretch}
#hero .projectHero > div:first-child > div{display:flex;align-items:center;gap:14px;min-width:0}
#hero .projectLogo{display:flex;align-items:center;gap:14px;min-width:0}
#hero .projectLogo img{max-width:84px;max-height:84px;object-fit:contain;display:block}
#hero .projectLogo .logoFallback{max-width:84px;min-width:84px;height:84px;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;padding:10px}
#hero .projectLogo b{display:block;font-size:clamp(20px,2vw,42px);line-height:1.1;word-break:break-word}
#hero .projectLogo .small{opacity:.9;line-height:1.35}
.projectSummaryGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.projectSummaryGrid .metric{min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px}
.projectTables{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.95fr);gap:16px}
.projectTables .span2{grid-column:1 / -1}
.card{min-width:0}
.chartBox{overflow-x:auto;overflow-y:hidden}
#trend{display:flex;align-items:flex-end;gap:10px;min-width:640px;padding-bottom:8px}
.tableWrap{overflow:auto}
.tableWrap table{min-width:720px}
.top .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .actions > *{min-width:0}
@media (max-width: 1100px){
  #hero .projectHero{grid-template-columns:1fr}
  .grid2,.projectTables{grid-template-columns:1fr}
  .projectTables .span2{grid-column:auto}
}
@media (max-width: 760px){
  .app{display:block !important}
  .side{display:none !important}
  .main{padding:12px !important}
  .top{display:flex;flex-direction:column;align-items:stretch !important;gap:12px}
  .top h1,#title{font-size:clamp(28px,7.2vw,46px);line-height:1.08;margin:0}
  .sub,#subtitle{font-size:13px;line-height:1.35}
  .top .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .top .actions .monthSel,.top .actions .btn{width:100% !important}
  #hero .projectHero > div:first-child > div{align-items:flex-start}
  .projectSummaryGrid{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px}
  .metric{padding:12px !important}
  .metric span{font-size:12px !important;line-height:1.2}
  .metric b{font-size:15px !important;line-height:1.15}
  .card{padding:14px !important;border-radius:18px}
  #trend{min-width:520px}
  .tableWrap table{min-width:640px}
}
@media (max-width: 480px){
  .main{padding:10px !important}
  .top .actions{grid-template-columns:1fr}
  #hero .projectLogo img{max-width:64px;max-height:64px}
  #hero .projectLogo .logoFallback{max-width:64px;min-width:64px;height:64px;border-radius:16px;font-size:14px}
  #hero .projectLogo b{font-size:18px}
  #hero .projectLogo .small{font-size:12px}
  .projectSummaryGrid{grid-template-columns:1fr !important}
  .metric{padding:11px !important}
  .metric span{font-size:11px !important}
  .metric b{font-size:18px !important}
  #trend{min-width:460px}
}
</style>
</head><body><div class="app"><aside class="side" id="sidebar"></aside><main class="main"><div class="top"><div><h1 id="title">Project Dashboard</h1><div class="sub" id="subtitle"></div></div><div class="actions"><select id="monthSel" class="monthSel" onchange="load()"></select><a class="btn" href="pilot-dashboard.html">← Dashboard</a></div></div><div id="hero"></div><section class="grid2"><div class="card"><h2>Project Monthly Progress</h2><div id="summary" class="projectSummaryGrid" style="margin-top:12px"></div><div class="progress"><div id="pbar"></div></div></div><div class="card"><h2>Daily Received vs Completed</h2><div id="trend" class="chartBox"></div></div></section><section class="projectTables"><div class="card"><h2>Active UPS</h2><div class="tableWrap"><table><thead><tr><th>Tracker</th><th>Serial</th><th>Stage</th><th>Status</th><th>Test Bay</th><th>Engineer</th><th>Open</th></tr></thead><tbody id="activeRows"></tbody></table></div></div><div class="card"><h2>Completed UPS</h2><div class="tableWrap"><table><thead><tr><th>Serial</th><th>Completed</th><th>Cycle Time</th><th>Fault</th></tr></thead><tbody id="completedRows"></tbody></table></div></div><div class="card span2"><h2>Faulty / RTA History</h2><div class="tableWrap"><table><thead><tr><th>Serial</th><th>Tracker</th><th>Stage</th><th>Reason</th><th>Engineer</th><th>Date/Time</th><th>Event</th></tr></thead><tbody id="faultRows"></tbody></table></div></div></section></main></div><script>window.P9K_PAGE_BUILD='3.16.5';</script><script src="pilot-common.js?v=3165"></script><script>
sidebar.innerHTML=nav('');const code=(new URLSearchParams(location.search).get('project')||'').toUpperCase();let project={},trackers=[],faults=[];
function months(){let n=new Date(),o='';for(let i=0;i<12;i++){let d=new Date(n.getFullYear(),n.getMonth()-i,1);o+=`<option value="${d.getFullYear()}-${d.getMonth()+1}">${d.toLocaleString([],{month:'long',year:'numeric'})}</option>`}monthSel.innerHTML=o}
function dur(a,b){if(!a||!b)return'—';let h=Math.round((new Date(b)-new Date(a))/36e5*10)/10;return h+' h'}
async function load(){let [yy,mm]=monthSel.value.split('-').map(Number),[a,b]=monthBounds(yy,mm);let [{data:p},{data:t},{data:f}]=await Promise.all([sb.from('p9k_prod_projects').select('*').eq('project_code',code).single(),sb.from('p9k_prod_trackers').select('*').eq('project_code',code).order('last_updated_at',{ascending:false}),sb.from('p9k_prod_fault_events').select('*').eq('project_code',code).order('created_at',{ascending:false})]);project=p||{};trackers=t||[];faults=f||[];title.textContent=(project.project_name||code)+' — Project Dashboard';subtitle.textContent=code==='STANDARD'?'General UPS · monthly quantity tracking':(project.fat_required?'FAT Required':'No FAT')+' · full project testing information';let sod=new Date();sod.setHours(0,0,0,0),mt=trackers.filter(x=>new Date(x.received_at)>=a&&new Date(x.received_at)<b),mc=trackers.filter(x=>x.completed_at&&new Date(x.completed_at)>=a&&new Date(x.completed_at)<b),act=trackers.filter(activeTracker),target=+project.monthly_target||0,pending=Math.max(target-mc.length,0),isStandard=code==='STANDARD',totalReq=isStandard?target:(+project.total_requirement||0),totalComp=isStandard?mc.length:trackers.filter(x=>x.completed_at).length,totalPending=isStandard?pending:Math.max(totalReq-totalComp,0),totalPct=totalReq?Math.min(100,Math.round(totalComp/totalReq*100)):0,todayR=trackers.filter(x=>new Date(x.received_at)>=sod).length,todayC=trackers.filter(x=>x.completed_at&&new Date(x.completed_at)>=sod).length,faultMonth=faults.filter(x=>x.event_type==='FAULTY'&&new Date(x.created_at)>=a&&new Date(x.created_at)<b),fpy=mc.length?Math.round((mc.length-new Set(faultMonth.filter(x=>mc.some(c=>c.tracker_id===x.tracker_id)).map(x=>x.tracker_id)).size)/mc.length*100):null;hero.innerHTML=`<div class="card"><div class="projectHero"><div><div class="projectLogo">${project.logo_data?`<img src="${project.logo_data}">`:`<div class="logoFallback">${esc(project.project_name||code)}</div>`}<div><b>${esc(project.project_name||code)}</b><div class="small">${isStandard?'General / Standard UPS · Monthly tracking':'Project Code '+esc(code)}</div></div></div></div><div class="projectSummaryGrid"><div class="metric"><span>${isStandard?'Monthly Target':'Total Requirement'}</span><b>${totalReq}</b></div><div class="metric"><span>${isStandard?'Monthly Completed':'Completed Till Date'}</span><b>${totalComp}</b></div><div class="metric"><span>${isStandard?'Pending to Target':'Overall Pending'}</span><b>${totalPending}</b></div><div class="metric"><span>${isStandard?'Monthly Progress':'Overall Progress'}</span><b>${totalPct}%</b></div><div class="metric"><span>Today Received</span><b>${todayR}</b></div><div class="metric"><span>Today Completed</span><b>${todayC}</b></div><div class="metric"><span>Live Testing</span><b>${act.length}</b></div><div class="metric"><span>Faulty Now</span><b>${act.filter(x=>x.is_faulty).length}</b></div></div></div></div>`;summary.innerHTML=`<div class="metric"><span>Monthly Target</span><b>${target}</b></div><div class="metric"><span>Monthly Received</span><b>${mt.length}</b></div><div class="metric"><span>Monthly Completed</span><b>${mc.length}</b></div><div class="metric"><span>Pending to Target</span><b>${pending}</b></div><div class="metric"><span>Heatrun In Progress</span><b>${act.filter(x=>x.current_stage==='HEATRUN_PROGRESS').length}</b></div><div class="metric"><span>Heatrun Completed</span><b>${act.filter(x=>x.current_stage==='HEATRUN_COMPLETED').length}</b></div><div class="metric"><span>FAT In Progress</span><b>${act.filter(x=>x.current_stage==='FAT_PROGRESS').length}</b></div><div class="metric"><span>FAT Completed</span><b>${act.filter(x=>x.current_stage==='FAT_COMPLETED').length}</b></div><div class="metric"><span>FPY / Fault-free</span><b>${fpy===null?'—':fpy+'%'}</b></div>`;pbar.style.width=(target?Math.min(100,mc.length/target*100):0)+'%';renderTrend(yy,mm,mt,mc);activeRows.innerHTML=act.length?act.map(x=>`<tr class="${x.is_faulty?'faultyRow':''}"><td>${trackerBadge(x)}</td><td>${esc(x.serial_no||'—')}</td><td>${x.is_faulty?'<span class="pill red">FAULTY / RTA</span>':stagePill(x.current_stage)}</td><td>${x.is_faulty?'<span class="pill red">FAULTY</span>':'Active'}</td><td>${esc(x.test_bay||'—')}</td><td>${esc(x.last_engineer||'—')}</td><td><a class="rowAction" href="pilot-scan.html?id=${encodeURIComponent(x.tracker_id)}">Open →</a></td></tr>`).join(''):'<tr><td colspan="7">No active UPS</td></tr>';completedRows.innerHTML=mc.length?mc.map(x=>`<tr><td>${esc(x.serial_no||'—')}</td><td>${dstr(x.completed_at)}</td><td>${dur(x.received_at,x.completed_at)}</td><td>${faults.some(f=>f.tracker_id===x.tracker_id&&f.event_type==='FAULTY')?'Yes':'No'}</td></tr>`).join(''):'<tr><td colspan="4">No completions this month</td></tr>';faultRows.innerHTML=faults.length?faults.map(f=>`<tr><td>${esc(f.serial_no||'—')}</td><td>${esc(f.tracker_id)}</td><td>${esc(STAGE_LABEL[f.stage]||f.stage||'—')}</td><td>${esc(f.reason||'—')}</td><td>${esc(f.engineer||'—')}</td><td>${dstr(f.created_at)}</td><td>${esc(f.event_type)}</td></tr>`).join(''):'<tr><td colspan="7">No fault/RTA history</td></tr>'}
function renderTrend(yy,mm,mt,mc){let days=new Date(yy,mm,0).getDate(),pts=[];for(let d=1;d<=days;d++){pts.push({d,r:mt.filter(x=>new Date(x.received_at).getDate()===d).length,c:mc.filter(x=>new Date(x.completed_at).getDate()===d).length})}let mx=Math.max(1,...pts.flatMap(x=>[x.r,x.c]));trend.innerHTML=pts.map(x=>`<div class="weekCol" style="min-width:10px"><div class="bars"><div class="bar ideal" style="height:${x.r/mx*130}px;width:7px"></div><div class="bar actual" style="height:${x.c/mx*130}px;width:7px"></div></div><div class="weekLab">${x.d}</div></div>`).join('')}
months();load();subscribeTrackers(load);
</script></body></html>
