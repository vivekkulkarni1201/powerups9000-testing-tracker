<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P9K Logic Test</title><link rel="stylesheet" href="test-style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="wrap"><div class="top"><div><h2>POWERUPS 9000 · Logic Test</h2><div class="sub">Function first. Beautification later.</div></div><div><a class="btn primary" href="test-qr-generator.html">Generate Test QR</a></div></div><div class="grid"><div class="kpi"><div id="received" class="n">0</div><div class="small">Received Today</div></div><div class="kpi"><div id="unlinked" class="n">0</div><div class="small">Serial Not Assigned</div></div><div class="kpi"><div id="active" class="n">0</div><div class="small">Active / Testing</div></div><div class="kpi"><div id="finished" class="n">0</div><div class="small">To Finishing</div></div></div><div class="panel"><div class="controls"><button class="btn" onclick="loadAll()">Refresh</button><div class="field"><label>Next serial counter</label><input id="counter" type="number" min="1" value="1"></div><button class="btn" onclick="setCounter()">Set Counter</button><button class="btn red" onclick="resetTest(false)">Clear Test Data</button><button class="btn red" onclick="resetTest(true)">Clear + Reset Counter</button><span id="msg" class="small"></span></div></div><div class="panel"><h3>Current Test Trackers</h3><div style="overflow:auto"><table><thead><tr><th>Tracker</th><th>Serial</th><th>Project</th><th>Stage</th><th>Engineer</th><th>Received</th><th>Last Update</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="panel"><h3>Latest History</h3><div style="overflow:auto"><table><thead><tr><th>Time</th><th>Tracker</th><th>Serial</th><th>Event</th><th>Stage</th><th>Engineer</th></tr></thead><tbody id="history"></tbody></table></div></div></div><script>
const cfg=window.P9K_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const N={RECEIVED:'Received',UNDER_TESTING:'Under Testing',HEATRUN_PROGRESS:'Heatrun In Progress',HEATRUN_COMPLETED:'Heatrun Completed',FAT_PROGRESS:'FAT In Progress',TO_FINISHING:'To Finishing'};const ft=v=>v?new Date(v).toLocaleString():'—';async function loadAll(){const [{data:t,error:e1},{data:h,error:e2},{data:s}]=await Promise.all([sb.from('p9k_test_trackers').select('*').order('received_at',{ascending:false}),sb.from('p9k_test_history').select('*').order('created_at',{ascending:false}).limit(40),sb.from('p9k_test_settings').select('*').eq('id',1).maybeSingle()]);if(e1||e2){msg.textContent=(e1||e2).message;return}const d=new Date();d.setHours(0,0,0,0);received.textContent=t.filter(x=>new Date(x.received_at)>=d).length;unlinked.textContent=t.filter(x=>!x.serial_no).length;active.textContent=t.filter(x=>x.serial_no&&x.current_stage!=='TO_FINISHING').length;finished.textContent=t.filter(x=>x.current_stage==='TO_FINISHING').length;if(s)counter.value=s.serial_counter;rows.innerHTML=t.map(x=>`<tr><td><b>${x.tracker_id}</b></td><td>${x.serial_no||'<span class="warn">Not Assigned</span>'}</td><td>${x.project_type||'—'}</td><td>${N[x.current_stage]||x.current_stage}</td><td>${x.last_engineer||'—'}</td><td>${ft(x.received_at)}</td><td>${ft(x.last_updated_at)}</td></tr>`).join('');history.innerHTML=h.map(x=>`<tr><td>${ft(x.created_at)}</td><td>${x.tracker_id}</td><td>${x.serial_no||'—'}</td><td>${x.event_type}</td><td>${N[x.stage]||x.stage||'—'}</td><td>${x.engineer||'—'}</td></tr>`).join('')}async function setCounter(){const {error}=await sb.rpc('p9k_test_set_serial_counter',{p_counter:parseInt(counter.value,10)});msg.textContent=error?error.message:'Counter updated';loadAll()}async function resetTest(r){if(!confirm(r?'Clear test data and reset counter?':'Clear isolated test data?'))return;const {error}=await sb.rpc('p9k_test_reset',{p_reset_counter:r});msg.textContent=error?error.message:'Cleared';loadAll()}loadAll();setInterval(loadAll,3000);
</script></body></html>
