<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P9K Test Scan</title><link rel="stylesheet" href="test-style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="scan"><div style="font-size:40px">⚡</div><h2 id="title">Checking Tracker…</h2><div id="tracker" class="big"></div><div id="content"></div><div id="status" class="small" style="margin-top:12px"></div><div style="margin-top:16px"><a class="btn" href="test-dashboard.html">Dashboard</a></div></div><script>
const cfg=window.P9K_CONFIG||{},sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),N={RECEIVED:'Received',UNDER_TESTING:'Under Testing',HEATRUN_PROGRESS:'Heatrun In Progress',HEATRUN_COMPLETED:'Heatrun Completed',FAT_PROGRESS:'FAT Testing In Progress',TO_FINISHING:'To Finishing'},q=new URLSearchParams(location.search),id=(q.get('id')||'').trim().toUpperCase();tracker.textContent=id||'No ID';async function load(){status.textContent='';if(!id)return fail('Tracker ID missing');const {data,error}=await sb.rpc('p9k_test_get_tracker',{p_tracker_id:id});if(error)return fail(error.message);if(!data.exists)return first();if(data.completed)return done(data);if(!data.serial_assigned)return serial(data);stages(data)}function first(){title.textContent='First Scan';content.innerHTML='<div class="box"><div class="small">FIRST ACTION</div><div class="big">Received</div><div class="small">First scan can only mark this tracker as Received.</div></div><button class="btn green" style="width:100%" onclick="receive()">CONFIRM RECEIVED</button>'}async function receive(){if(!confirm('Confirm '+id+' as Received?'))return;const {error}=await sb.rpc('p9k_test_receive',{p_tracker_id:id});if(error)return fail(error.message);ok('Received recorded');setTimeout(load,700)}function serial(d){title.textContent='Received · Serial Not Assigned';content.innerHTML=`<div class="box"><div class="small">CURRENT</div><div class="big">${N[d.current_stage]}</div></div><div class="field"><label>Project</label><select id="project"><option>ADANI</option><option>RELIANCE</option><option>STANDARD</option></select></div><div class="field" style="margin-top:9px"><label>Engineer</label><input id="engineer" placeholder="Engineer name"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="assign()">ASSIGN GENERATED SERIAL</button>`}async function assign(){const en=engineer.value.trim(),pr=project.value;if(!en)return alert('Enter engineer');if(!confirm('Assign next serial to '+id+'?'))return;const {data,error}=await sb.rpc('p9k_test_assign_serial',{p_tracker_id:id,p_project_type:pr,p_engineer:en});if(error)return fail(error.message);ok('Serial assigned: '+data.serial_no);setTimeout(load,800)}function stages(d){title.textContent='Update Testing Stage';content.innerHTML=`<div class="box"><div class="small">SERIAL</div><div class="big">${d.serial_no}</div><div class="small" style="margin-top:8px">PROJECT</div><div>${d.project_type}</div><div class="small" style="margin-top:8px">CURRENT</div><div>${N[d.current_stage]||d.current_stage}</div></div><div class="field"><label>Engineer</label><input id="engineer" value="${d.last_engineer||''}" placeholder="Engineer name"></div><div class="small" style="margin-top:12px">Choose any remaining valid stage — no fixed sequence.</div><div class="stagegrid">${(d.allowed_stages||[]).map(s=>`<button class="stagebtn" onclick="upd('${s}')">${N[s]}</button>`).join('')}</div>`}async function upd(s){const en=engineer.value.trim();if(!en)return alert('Enter engineer');if(!confirm('Confirm '+N[s]+'?'))return;const {error}=await sb.rpc('p9k_test_update_stage',{p_tracker_id:id,p_stage:s,p_engineer:en});if(error)return fail(error.message);ok('Updated to '+N[s]);setTimeout(load,800)}function done(d){title.textContent='Flow Completed';content.innerHTML=`<div class="box"><div class="small">SERIAL</div><div class="big">${d.serial_no}</div><div class="small" style="margin-top:8px">FINAL STATUS</div><div class="big ok">To Finishing</div><div class="small">Further stage updates are locked.</div></div>`}function ok(m){status.textContent='✅ '+m;status.className='ok'}function fail(m){title.textContent='Action Failed';status.textContent='❌ '+m;status.className='err'}load();
</script></body></html>
