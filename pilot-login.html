<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POWERUPS 9000 Login</title><link rel="stylesheet" href="pilot.css"><link rel="stylesheet" href="premium.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="loginShell"><div class="loginCard"><div class="brand">VERTIV<small>POWERUPS 9000 TESTING TRACKER</small></div><h2>Engineer / Admin Login</h2><div class="small">Dashboard viewing can remain public. Login is used for update/admin access in secure mode.</div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" style="width:100%" onclick="login()">Login</button><div id="msg" class="small" style="margin-top:10px"></div><div class="actions" style="margin-top:12px"><a class="btn" href="pilot-dashboard.html">View Dashboard</a></div></div></div><script src="pilot-common.js"></script><script>async function login(){msg.textContent='Signing in...';let {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent='❌ '+error.message;return}let role=await getMyRole();msg.textContent='✅ Logged in as '+role;setTimeout(()=>location.href=role==='ADMIN'?'pilot-admin.html':'pilot-dashboard.html',400)}</script></body></html>
